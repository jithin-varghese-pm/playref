name = "playref"
pages_build_output_dir = "./dist"
compatibility_date = "2025-10-01"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "playref"
# Created 2 Nov 2026 on Jithin's personal Cloudflare account.
database_id = "3e8a1b61-cccf-476e-bb64-206810697130"
migrations_dir = "migrations"

[vars]
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Secrets (set with `npx wrangler pages secret put <NAME>`, never committed):
#   EVAL_TOKEN  lets evals/run.mjs skip the rate limit and saved answers
#   ID_SALT     salt for hashing IP addresses
