<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} body{margin:0;width:1200px;height:630px;overflow:hidden;background:#C8102E;font-family:Inter,sans-serif;color:#fff;position:relative}
.wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
.mark{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:800;font-size:112px;line-height:.9}
.mark span{color:#FFD100}
.by{display:flex;align-items:center;gap:12px;font-size:24px;color:#FFE3E6;margin-top:10px}
.by img{height:54px}
h1{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:800;font-size:66px;line-height:.95;margin:0;max-width:640px}
.pill{display:inline-flex;align-items:center;gap:10px;background:#1A1A1A;color:#FFD100;font-weight:700;font-size:22px;padding:10px 18px;border-radius:999px;letter-spacing:.03em}
.foot{display:flex;align-items:center;gap:16px}
.url{font-size:24px;font-weight:600;color:#FFE3E6}
.card{position:absolute;right:86px;top:92px;width:330px;height:440px;background:#fff;border-radius:28px;padding:14px;transform:rotate(-6deg);box-shadow:0 24px 50px rgba(0,0,0,.35)}
.inner{height:100%;border-radius:20px;background:#FFD100;color:#1A1A1A;padding:26px;display:flex;flex-direction:column;justify-content:space-between}
.lab{font-weight:700;letter-spacing:.14em;font-size:18px}
.word{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:800;font-size:110px;line-height:.86}
.line{font-weight:600;font-size:22px;line-height:1.3}
.back{position:absolute;right:150px;top:120px;width:300px;height:410px;background:#1A1A1A;border:12px solid #fff;border-radius:26px;transform:rotate(9deg)}
</style></head><body>
<div class="back"></div>
<div class="card"><div class="inner"><div class="lab">AI VERDICT</div><div class="word">HOUSE<br>RULE</div><div class="line">Official rules say no. Stacking +2s is a house rule.</div></div></div>
<div class="wrap">
  <div><div class="mark">Play<span>ref</span></div><div class="by">by <img src="../../public/mbm-logo.png"></div></div>
  <h1>Rule fight mid-game? Ask the AI referee.</h1>
  <div class="foot"><span class="pill">&#10022; AI referee &middot; UNO Classic rules</span><span class="url">playref.pages.dev</span></div>
</div></body></html>
